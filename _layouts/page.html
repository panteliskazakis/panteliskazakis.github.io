---
layout: default
---
<article class="content-page">
  {% unless page.minimal %}
  <header class="page-heading">
    <p class="eyebrow">{{ page.kicker | default: 'Pantelis Kazakis' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="prose page-prose">{{ content }}</div>
</article>
